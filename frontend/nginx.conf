server {
    listen 8080;
    root /usr/share/nginx/html;

    # Re-resolve "api" via Docker's DNS: a redeploy recreates the api container with a
    # new IP, and a static proxy_pass would keep sending traffic to the old one.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # W3C trace context passes through untouched (traceparent header).
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
