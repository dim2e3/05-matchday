name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, unit, integration on Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: matchday_test
          POSTGRES_USER: matchday
          POSTGRES_PASSWORD: matchday
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U matchday -d matchday_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://matchday:matchday@localhost:5432/matchday_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"
      - run: uv --directory backend sync --frozen
      - run: uv --directory backend run ruff check .
      - run: uv --directory backend run pytest -q
      - name: alert-bridge tests
        run: |
          uv --directory alert-bridge sync --frozen
          uv --directory alert-bridge run ruff check .
          uv --directory alert-bridge run python -m pytest -q
      - name: Migrations match the models
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          uv --directory backend run alembic upgrade head
          uv --directory backend run alembic check

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build

  e2e:
    name: E2E (compose + Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: docker compose up --build -d --wait
      - run: npm --prefix e2e ci
      - run: npm --prefix e2e exec -- playwright install --with-deps chromium
      - run: npm --prefix e2e test
        env:
          CI: "true"
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
