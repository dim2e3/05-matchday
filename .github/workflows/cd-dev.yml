# CD: every green CI run on main builds images tagged sha-<short> and deploys them to dev.
name: CD (dev)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push images
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        run: |
          short=$(git rev-parse --short=7 HEAD)
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$short" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/matchday" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: GIT_SHA=${{ steps.meta.outputs.short }}
          push: true
          tags: ${{ steps.meta.outputs.prefix }}/backend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.prefix }}/frontend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: fake-espn
        uses: docker/build-push-action@v6
        with:
          context: .
          file: fake-espn/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.prefix }}/fake-espn:${{ steps.meta.outputs.tag }}

  deploy-dev:
    needs: build
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: dev
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit
