apiVersion: 1

contactPoints:
  - orgId: 1
    name: oncall-agent
    receivers:
      - uid: alert-bridge-webhook
        type: webhook
        settings:
          # alert-bridge collects telemetry context and wakes the on-call agent (docs/runbook.md).
          url: ${ALERT_WEBHOOK_URL}
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: ${ALERT_WEBHOOK_TOKEN}
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: oncall-agent
    group_by: ["grafana_folder", "alertname", "deployment_environment", "league"]
    group_wait: 10s
    group_interval: 1m
    # One investigation per incident; a still-firing alert is re-sent only after this.
    repeat_interval: 4h
