# api and worker send all three signals here over OTLP; the Collector fans them out.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  # Defense in depth for the privacy rule in AGENTS.md: the app never records these, but if
  # an instrumentation upgrade starts to, scrub them before they are stored.
  transform/redact:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_pattern(attributes["url.full"], "/bot[^/]+/", "/bot<redacted>/")
          - replace_pattern(attributes["http.url"], "/bot[^/]+/", "/bot<redacted>/")
          - delete_key(attributes, "http.request.header.cookie")
          - delete_key(attributes, "http.request.header.x_telegram_bot_api_secret_token")
    log_statements:
      - context: log
        statements:
          - replace_pattern(body, "/bot[^/ ]+/", "/bot<redacted>/")

exporters:
  # Prometheus ingests OTLP metrics natively (--web.enable-otlp-receiver).
  otlphttp/prometheus:
    metrics_endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
  # Loki ingests OTLP logs natively; trace_id/span_id become structured metadata.
  otlphttp/loki:
    logs_endpoint: http://loki:3100/otlp/v1/logs
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/prometheus]
    logs:
      receivers: [otlp]
      processors: [transform/redact, batch]
      exporters: [otlphttp/loki]
    traces:
      receivers: [otlp]
      processors: [transform/redact, batch]
      exporters: [otlp/tempo]
