# Telemetry stack: OTel Collector → Prometheus (metrics), Loki (logs), Tempo (traces) → Grafana.
# Included by the root compose.yaml for local runs; deploy/compose.ops.yaml runs the same
# configuration on the EC2 host.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [prometheus, loki, tempo]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-otlp-receiver
      # Ingest a zero at each new series' start so increase() counts its first event.
      - --enable-feature=created-timestamp-zero-ingestion
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki:/loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo:/var/tempo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: ${GF_AUTH_ANONYMOUS_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: ${GF_AUTH_ANONYMOUS_ORG_ROLE:-Admin}
      GF_AUTH_DISABLE_LOGIN_FORM: ${GF_AUTH_DISABLE_LOGIN_FORM:-true}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/matchday.json
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://alert-bridge:8000/alerts}
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:-dev-alert-token}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus, loki, tempo]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 24

  alert-bridge:
    image: ${IMAGE_PREFIX:-matchday}/alert-bridge:${BRIDGE_TAG:-local}
    build: ../alert-bridge
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_PASSWORD: ${GRAFANA_BRIDGE_PASSWORD:-}
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:-dev-alert-token}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-}
      GITHUB_DISPATCH_TOKEN: ${GITHUB_DISPATCH_TOKEN:-} # empty: dry-run, incidents only
    volumes:
      - incidents:/data/incidents
    ports:
      - "127.0.0.1:${BRIDGE_PORT:-8095}:8000"
    restart: unless-stopped

volumes:
  incidents:
  prometheus:
  loki:
  tempo:
  grafana:
