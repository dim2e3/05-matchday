# One MatchDay environment on the EC2 host (dev or prod), run from /opt/matchday/<env>
# as compose project "matchday-<env>". Images come from GHCR; nothing is built here.
# All settings come from ./.env, written by the deploy workflow (see docs/deployment.md).

x-backend: &backend
  image: ${IMAGE_PREFIX}/backend:${TAG}
  environment:
    DATABASE_URL: postgresql+asyncpg://matchday:${POSTGRES_PASSWORD}@postgres:5432/matchday
    ESPN_BASE_URL: ${ESPN_BASE_URL}
    TELEGRAM_API_BASE: ${TELEGRAM_API_BASE}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
    TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
    TELEGRAM_MODE: ${TELEGRAM_MODE}
    COOKIE_SECURE: "true"
    POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
    SCOREBOARD_CACHE_TTL_SECONDS: ${SCOREBOARD_CACHE_TTL_SECONDS:-15}
    DEPLOY_ENV: ${DEPLOY_ENV}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${DEPLOY_ENV}
  restart: unless-stopped
  networks: [default, ops]
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: matchday
      POSTGRES_USER: matchday
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "matchday", "-d", "matchday"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  # Dev only (COMPOSE_PROFILES=fake): stand-in ESPN + Telegram for the incident demo.
  fake-espn:
    image: ${IMAGE_PREFIX}/fake-espn:${TAG}
    profiles: [fake]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  api:
    <<: *backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    <<: *backend
    command: ["python", "-m", "matchday.worker"]
    depends_on:
      api:
        condition: service_healthy

  frontend:
    image: ${IMAGE_PREFIX}/frontend:${TAG}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      default:
      edge:
        aliases: ["matchday-${DEPLOY_ENV}-frontend"]
    logging: *logging

volumes:
  pgdata:

networks:
  edge:
    external: true
  ops:
    external: true
