# Caddy in front of every environment; automatic HTTPS for the sslip.io hostnames.
# Runs from /opt/matchday/edge as compose project "matchday-edge".
services:
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      PROD_HOST: ${PROD_HOST}
      DEV_HOST: ${DEV_HOST}
      GRAFANA_HOST: ${GRAFANA_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks: [edge]

volumes:
  caddy_data:
  caddy_config:

networks:
  edge:
    external: true
